name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CP1–CP4 tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: python -m pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py -m "not docker" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "Missing GitHub secret RAILWAY_TOKEN"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "Missing GitHub variable RAILWAY_PROJECT_ID"; exit 1; }
          test -n "$RAILWAY_SERVICE_NAME" || { echo "Missing GitHub variable RAILWAY_SERVICE_NAME"; exit 1; }
          test -n "$PUBLIC_URL" || { echo "Missing GitHub variable PUBLIC_URL"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy to Railway
        run: railway up --project "$RAILWAY_PROJECT_ID" --environment production --service "$RAILWAY_SERVICE_NAME"
      - name: Smoke test
        run: |
          curl --fail --silent --show-error "$PUBLIC_URL/health"
          curl --fail --silent --show-error "$PUBLIC_URL/ready"
